# Nightly re-check of PRs labeled needs-v2: unblocks them once the target migrates to the V2 plugin
# API, and closes them after 60 days on V1 (see docs/policy.md).
name: Re-check V2 migrations

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Only this PR number (optional)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: reprobe
  cancel-in-progress: false

jobs:
  reprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-check held PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLY_PR: ${{ inputs.pr }}
        run: |
          if [ -n "${ONLY_PR:-}" ]; then
            node scripts/reprobe.js --pr "$ONLY_PR"
          else
            node scripts/reprobe.js
          fi
