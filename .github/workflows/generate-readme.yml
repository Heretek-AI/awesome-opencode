name: Auto-Generate README

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
  workflow_dispatch:

# main requires a passing "validate" check on every commit, so the regenerated README is first pushed
# to a bot/readme-* branch, validated there, and then fast-forwarded onto main.
permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: auto-generate-readme-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # Full history: "Recently added" is derived from when each entry file was first committed
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate, validate and publish README/registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Generation attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main

            # Both scripts validate the whole catalog and exit non-zero without writing on any error
            node scripts/generate-readme.js
            node scripts/export-json.js --pretty --output dist/registry.json

            if git diff --quiet -- README.md dist/registry.json; then
              echo "README.md and dist/registry.json are already current."
              exit 0
            fi

            git add README.md dist/registry.json
            git commit -m "docs: auto-regenerate README and registry data"
            sha="$(git rev-parse HEAD)"
            branch="bot/readme-${sha:0:12}"

            # Stage the commit and run the required "validate" check on it
            git push --force origin "HEAD:refs/heads/${branch}"
            gh workflow run validate-pr.yml --ref "${branch}"
            conclusion=""
            for i in $(seq 1 60); do
              sleep 10
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=validate" \
                --jq '[.check_runs[] | select(.status == "completed") | .conclusion][0] // ""')"
              [ -n "${conclusion}" ] && break
            done

            if [ "${conclusion}" != "success" ]; then
              git push origin --delete "${branch}" || true
              echo "validate on ${sha} finished with '${conclusion:-timeout}'; not publishing" >&2
              exit 1
            fi

            if git push origin "${sha}:refs/heads/main"; then
              git push origin --delete "${branch}" || true
              exit 0
            fi

            git push origin --delete "${branch}" || true
            echo "main moved while validating; retrying..."
          done

          echo "Failed to publish regenerated README/registry after retries" >&2
          exit 1
