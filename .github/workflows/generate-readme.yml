name: Auto-Generate README

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
  workflow_dispatch:

# main requires a passing "validate" check, which rulesets only accept through a pull request merge.
# The regenerated README therefore goes through a bot PR: branch bot/readme-<sha>, validate dispatched on
# it, then squash-merged by this job once the check passes.
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: auto-generate-readme-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history: "Recently added" is derived from when each entry file was first committed
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate, validate and merge README/registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Close bot README PRs left open by earlier failed runs; this run supersedes them
          for old in $(gh pr list --state open --search "head:bot/readme-" --json number,headRefName \
                         --jq '.[] | select(.headRefName | startswith("bot/readme-")) | .number'); do
            gh pr close "$old" --delete-branch --comment "Superseded by a newer README regeneration." || true
          done

          # Both scripts validate the whole catalog and exit non-zero without writing on any error
          node scripts/generate-readme.js
          node scripts/export-json.js --pretty --output dist/registry.json

          if git diff --quiet -- README.md dist/registry.json; then
            echo "README.md and dist/registry.json are already current."
            exit 0
          fi

          git add README.md dist/registry.json
          git commit -m "docs: auto-regenerate README and registry data"
          sha="$(git rev-parse HEAD)"
          branch="bot/readme-${sha:0:12}"
          git push --force origin "HEAD:refs/heads/${branch}"

          pr="$(gh pr create --base main --head "${branch}" \
                  --title "docs: auto-regenerate README and registry data" \
                  --body "Automated by \`generate-readme.yml\` after ${GITHUB_SHA:0:12}. Merged automatically once \`validate\` passes.")"
          echo "Opened ${pr}"

          gh workflow run validate-pr.yml --ref "${branch}"
          conclusion=""
          for i in $(seq 1 60); do
            sleep 10
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=validate" \
              --jq '[.check_runs[] | select(.status == "completed") | .conclusion][0] // ""')"
            [ -n "${conclusion}" ] && break
          done
          if [ "${conclusion}" != "success" ]; then
            echo "validate on ${sha} finished with '${conclusion:-timeout}'; leaving ${pr} open for a maintainer" >&2
            exit 1
          fi

          # The required check can take a moment to register on the PR
          for i in 1 2 3 4 5 6; do
            if gh pr merge "${pr}" --squash --delete-branch --subject "docs: auto-regenerate README and registry data"; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not merge ${pr}; leaving it open for a maintainer" >&2
          exit 1
