# The required "validate" status check. Runs on every PR (including README-only and non-data PRs, so
# hand edits to generated files get feedback) and on workflow_dispatch, which bot workflows use to
# attach the check to branches they push with GITHUB_TOKEN.
name: Validate PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Check catalog changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/check-pr.js --base "$BASE_REF"

      - name: README and registry still generate
        run: |
          node scripts/generate-readme.js
          node scripts/export-json.js --output "$RUNNER_TEMP/registry.json"
