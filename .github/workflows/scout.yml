# Weekly discovery of OpenCode V2 plugins and SDK tools on npm that are not in the catalog yet.
# Opens a "Scout" issue; ticking a candidate's box opens a PR (see issues.yml).
name: Scout V2 packages

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Find candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/scout.js run
