name: Godmode
repo: https://github.com/AIimagined/Godmode
tagline: A local, tamper-evident record of what a coding agent did, what it claimed, and what was verified.
description: Godmode keeps a hash-chained local record of what a coding agent did, what it claimed, and what was verified, and refuses "done" without a citation. On OpenCode it runs as an AGENTS.md instruction adapter plus an optional Bun plugin shim (adapters/opencode/godmode.opencode.js) that routes every bash, write, edit and patch call through the same pre-tool gate the other hosts use and throws before a refused tool runs. Zero runtime dependencies, zero network use, nothing leaves the machine.
kind: plugin
topics:
  - observability
  - code-quality
compat: v1
