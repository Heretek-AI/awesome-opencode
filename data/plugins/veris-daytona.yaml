name: Veris for Daytona
repo: https://github.com/veris-ai/veris-daytona
tagline: OpenCode sessions run in a Daytona sandbox whose vendor API calls are answered by Veris twins
description: >-
  Every OpenCode session runs in a Daytona sandbox whose calls to Stripe and the rest of your
  vendor stack are answered by stateful Veris twins, and the agent gets a receipt of what the
  vendor actually received. Unmodified code, real hostnames, no image to build.
