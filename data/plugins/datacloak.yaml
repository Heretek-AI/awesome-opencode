name: DataCloak
repo: https://github.com/pratikwayal01/datacloak
tagline: Swap secrets and PII for realistic fakes before AI sees them; restore originals on return.
description: Local-first sensitive-data protection for OpenCode. Cloaks API keys, JWTs, PEMs, env vars, DSNs, emails, phones and IPs with Faker-generated synthetics pre-dispatch, blocks env-dump tool calls, redacts tool output, and auto-restores originals into file writes. Zero-config and fully automatic.
scope:
  - global
tags:
  - security
  - privacy
  - secrets
  - redaction
min_version: 1.18.0
