name: telepathy
repo: https://github.com/Winterrks/telepathy
tagline: OpenCode sessions message Claude Code, Codex, Gemini CLI and other agent sessions on the same machine
description: Adds telepathy_list_peers, telepathy_send_message and telepathy_read_messages as native OpenCode tools, so an OpenCode session can find and message the Claude Code, Codex, Gemini CLI, Copilot CLI, Cursor and other agent sessions running on the same machine. The plugin runs inside OpenCode and starts a turn in an idle session when a message arrives, so agents can coordinate without polling. Everything stays local (messages are JSON files in ~/.telepathy, with no network calls and no telemetry). MIT licensed.
kind: plugin
topics:
  - orchestration
compat: v2
scope:
  - global
tags:
  - multi-agent
  - messaging
  - claude-code
  - codex
  - local
installation: |
  Add telepathy to the `plugin` list in `~/.config/opencode/opencode.json`:

  ```json
  { "plugin": ["telepathy@git+https://github.com/Winterrks/telepathy.git"] }
  ```

  Requires Node.js 20 or newer. OpenCode 1.x only. Install telepathy in the other agents too (see the repository README).
