name: PRs
repo: https://github.com/vvo/opencode-plugins
path: packages/prs
npm: opencode-prs
homepage: https://www.npmjs.com/package/opencode-prs
tagline: Lists GitHub pull requests referenced by the current session
description: OpenCode TUI plugin that lists GitHub pull requests opened by the current session in the sidebar, with titles scrolling on hover. Requires an installed and authenticated GitHub CLI.
kind: plugin
topics:
  - git
  - ui
compat: v2
scope:
  - global
tags:
  - github
  - pull-requests
  - tui
  - sidebar
installation: |
  OpenCode 2, in `~/.config/opencode/cli.json`:

  ```json
  { "plugins": ["opencode-prs"] }
  ```

  OpenCode 1, in `~/.config/opencode/tui.json`:

  ```json
  { "plugin": ["opencode-prs"] }
  ```
