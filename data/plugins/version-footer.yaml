name: OpenCode Version Footer
repo: https://github.com/vvaldez/opencode-plugins
path: packages/version-footer
tagline: Show the OpenCode version in the session footer
description: Small TUI plugin that displays the harness version (e.g. v2.0.27) in the in-session footer status row via the documented prompt.footer.status slot. The session footer has no built-in version display, and the home footer hides its version below 64 columns. ~15 lines — no network calls, no filesystem access, no shell execution, no telemetry. MIT licensed.
kind: plugin
topics:
  - ui
compat: v2
