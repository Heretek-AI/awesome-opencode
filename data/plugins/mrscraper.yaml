name: MrScraper
repo: https://github.com/mrscraper-com/mrscraper-opencode-plugin
tagline: Web pages as HTML, Markdown, or screenshots, plus Google search, through the hosted MrScraper MCP server
description: >-
  OpenCode plugin that registers the hosted MrScraper MCP server
  (https://mcp.mrscraper.com/mcp, OAuth 2.1) and three on-demand skills. Its
  tools retrieve known pages as HTML, Markdown, or screenshots (scraperAPI),
  search Google (webSearch), and report account usage (status). The skills
  follow a retrieve-first workflow that preserves raw page content and derives
  structured output locally. Works in OpenCode 2 and OpenCode 1. A MrScraper
  account is required.
scope:
  - global
  - project
tags:
  - mcp
  - web-scraping
  - screenshots
  - google-search
  - serp
homepage: https://docs.mrscraper.com/docs/getting-started/mcp-server
installation: |
  ```bash
  # OpenCode 2
  opencode plugin add @mrscraper/opencode
  # OpenCode 1
  opencode plugin @mrscraper/opencode --global

  opencode mcp auth mrscraper
  ```

  `opencode mcp list` shows `mrscraper` as connected after sign-in.
