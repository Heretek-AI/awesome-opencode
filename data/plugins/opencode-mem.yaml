name: Opencode Mem
repo: https://github.com/tickernelz/opencode-mem
tagline: Persistent local memory with Turso/libSQL vector search
description: A persistent memory system for AI coding agents that enables long-term context retention across sessions using embedded Turso/libSQL vector search. Features dual memory scopes, auto-capture, user profile learning, a full web UI, and multi-provider AI support.
