name: opencode-llm-proxy
repo: https://github.com/KochC/opencode-llm-proxy
npm: opencode-llm-proxy
homepage: https://www.npmjs.com/package/opencode-llm-proxy
tagline: OpenCode-backed API gateway with tool calling
description: Local OpenCode plugin that exposes OpenAI Chat Completions, OpenAI Responses, Anthropic Messages, and Gemini-compatible endpoints for any model configured in OpenCode. Supports streaming, model listing, and real tool/function calling including parallel tool calls, so tools like n8n, Open WebUI, LangChain, Continue, Zed, and coding agents can reuse the same OpenCode model setup.
kind: plugin
topics:
  - providers
compat: v2
scope:
  - global
  - project
tags:
  - openai
  - anthropic
  - gemini
  - responses-api
  - llm-gateway
  - tool-calling
  - n8n
  - open-webui
  - langchain
installation: |
  Add the package to `opencode.json`:

  ```json
  {
    "plugins": ["opencode-llm-proxy"]
  }
  ```

  This is the OpenCode V2 key. On OpenCode V1, use `"plugin": ["opencode-llm-proxy"]` instead; the package supports both.

  The proxy starts automatically on `http://127.0.0.1:4010`.
