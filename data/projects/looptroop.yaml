name: LoopTroop
repo: https://github.com/looptroop-ai/LoopTroop
homepage: https://www.looptroop.ovh/
tagline: Local GUI orchestrator for autonomous AI coding using multi-model planning councils and isolated worktrees
description: Local-first, open-source GUI orchestrator that runs long-running AI coding tickets end-to-end. An LLM Council plans the work, tasks are decomposed into atomic units (Beads) executed in isolated git worktrees, and a Ralph Loop recovers from errors with a fresh context. Built on OpenCode.
kind: client
topics:
