name: OpenCode Database Cleaner
repo: https://github.com/chncaesar/opencode-db-clean
tagline: Safely analyze and reclaim unused space in OpenCode's SQLite database
description: >-
  A zero-dependency Python CLI that reports live data and freelist bloat in
  OpenCode's local SQLite database, then safely reclaims unused disk space with
  process checks, WAL checkpointing, verified backups, VACUUM, and integrity
  checks. It does not delete sessions.
scope:
  - global
tags:
  - database
  - sqlite
  - maintenance
  - disk-space
  - reliability
installation: |
  Install from PyPI:

  ```bash
  pip install ocdbc
  ```

  Run `ocdbc analyze` first. Close OpenCode before running `ocdbc vacuum`.
