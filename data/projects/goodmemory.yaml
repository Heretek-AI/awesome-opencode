name: GoodMemory
repo: https://github.com/hjqcan/GoodMemory
tagline: Local-first, auditable memory for OpenCode through MCP
description: Gives OpenCode durable user and project memory across sessions
  through a standalone MCP server. Uses SQLite by default, keeps recall
  inspectable, and makes memory writes opt-in.
scope:
  - global
  - project
tags:
  - mcp
  - memory
  - local-first
  - opencode
  - ai-agents
homepage: https://github.com/hjqcan/GoodMemory
installation: |
  npm install -g goodmemory@0.7.0

  Add the `mcp.goodmemory` block from the OpenCode setup guide:
  https://github.com/hjqcan/GoodMemory/blob/main/docs/GoodMemory-OpenCode-Setup-Guide.md
